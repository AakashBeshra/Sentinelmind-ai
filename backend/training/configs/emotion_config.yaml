model:
  name: "bhadresh-savani/distilbert-base-uncased-emotion"
  num_labels: 6
  max_length: 128

training:
  batch_size: 64
  learning_rate: 2.0e-5
  epochs: 10
  warmup_ratio: 0.1
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  use_mixed_precision: true

data:
  train_path: "../data/processed/emotion_train.csv"
  val_path: "../data/processed/emotion_val.csv"

output:
  model_dir: "../models/emotion"
  logs_dir: "../logs"